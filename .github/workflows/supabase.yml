# RLS tests against a local stack (docs/09 M0.8/M0.9, CLAUDE.md §7, docs/06 §3).
name: supabase

on:
  push:
    paths: ["supabase/**", ".github/workflows/supabase.yml", "app/lib/data/**", "app/test/supabase/**"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml", "app/lib/data/**", "app/test/supabase/**"]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      # Keep db + auth (tests write auth.users); skip services pgTAP doesn't use.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
      # send-push's pure logic (VAPID JWT, delivery outcomes), docs/09 M5.3b.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --experimental-strip-types --test functions/send-push/push_test.ts functions/delete-account/deletion_test.ts
        working-directory: supabase

  # The app's Supabase code against a local stack (docs/09 M6.1): the email
  # sign-in through Mailpit, the PKCE callback, the stores under RLS.
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      # Edge runtime on: the client tests call delete-account (M6.5).
      - run: supabase start -x storage-api,imgproxy,postgres-meta,studio,logflare,vector,supavisor
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: flutter test --tags supabase
        working-directory: app
        run: |
          # The local stack's demo keys; the service-role one only checks that
          # deleted rows are gone (test-only, 06 §1).
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|MAILPIT_URL)=')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" MAILPIT_URL="$MAILPIT_URL" \
            flutter test --tags supabase --concurrency=1
