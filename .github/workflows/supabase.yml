# RLS tests against a local stack (docs/09 M0.8/M0.9, CLAUDE.md §7, docs/06 §3).
name: supabase

on:
  push:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      # Keep db + auth (tests write auth.users); skip services pgTAP doesn't use.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
      - run: supabase test db
