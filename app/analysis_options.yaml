include: package:flutter_lints/flutter.yaml

# Native analyzer plugin (replaces custom_lint, M0.11).
plugins:
  riverpod_lint: ^3.1.3

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: info
    # freezed requires @JsonSerializable/@JsonKey on factory constructors and
    # their parameters, which the analyzer flags as an invalid target.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - no_leading_underscores_for_local_identifiers
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_build_context_synchronously
    - use_key_in_widget_constructors
