name: dottoday
description: Visual timeline day planner for iOS, Android, macOS and Web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"  # ships Dart 3.8

# Versions are floors; `flutter pub get` pins them in pubspec.lock (commit the lockfile).
# Agents: run `flutter pub outdated` and bump deliberately; justify any new dependency.
dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.5
  device_calendar: ^4.3.0
  # reason: drift/drift_dev >=2.32 require sqlite3 3.x (native-assets build, affects SQLCipher
  # packaging). Decided in M2.1; keep both <2.32 until then.
  drift: ">=2.28.0 <2.32.0"
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  # reason: >=19 needs timezone ^0.11, blocked by device_calendar (see timezone).
  flutter_local_notifications: ^18.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  home_widget: ^0.10.0
  intl: ^0.20.3  # 0.20 required by flutter_localizations in Flutter 3.47
  json_annotation: ^4.11.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.0
  riverpod_annotation: ^4.0.2
  rrule: ^0.2.16
  sentry_flutter: ^10.0.0
  share_plus: ^13.3.1
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0
  supabase_flutter: ^2.8.0
  # reason: device_calendar 4.3.3 (latest, last published 2024-09) requires timezone ^0.9;
  # revisit in M7.1 (calendar import) - fork/replace device_calendar or wait for a release.
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  uuid: ^4.5.0

dev_dependencies:
  # Policy tests (test/policy) parse source with package:analyzer directly.
  # reason (<10): drift_dev <2.32 (M2.1 cap) needs analyzer <10.
  analyzer: ^9.0.0
  build_runner: ^2.15.1
  drift_dev: ">=2.28.0 <2.32.0" # reason: see drift above (M2.1)
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5 # reason: freezed 4 needs analyzer ^14, blocked by the drift cap (M2.1)
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.13.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

flutter:
  uses-material-design: true
  generate: true   # AppLocalizations from lib/core/l10n/arb (see l10n.yaml)
  assets:
    - assets/design/palette.json
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
