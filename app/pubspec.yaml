name: dottoday
description: Visual timeline day planner for iOS, Android, macOS and Web.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"  # ships Dart 3.8

# Versions are floors; `flutter pub get` pins them in pubspec.lock (commit the lockfile).
# Agents: run `flutter pub outdated` and bump deliberately; justify any new dependency.
dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.5
  device_calendar: ^4.3.0
  drift: ^2.35.2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  # reason: >=19 needs timezone ^0.11, blocked by device_calendar (see timezone).
  flutter_local_notifications: ^18.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  home_widget: ^0.10.0
  intl: ^0.20.3  # 0.20 required by flutter_localizations in Flutter 3.47
  json_annotation: ^4.11.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.0
  riverpod_annotation: ^4.0.2
  rrule: ^0.2.16
  sentry_flutter: ^10.0.0
  share_plus: ^13.3.1
  # SQLCipher is built by sqlite3's native-assets hook (see `hooks:` below, ADR-0006).
  sqlite3: ^3.0.0
  supabase_flutter: ^2.8.0
  # reason: device_calendar 4.3.3 (latest, last published 2024-09) requires timezone ^0.9.
  # Revisited in M7.1: kept (it works on iOS/Android; replacing it is an ADR-level change).
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  workmanager: ^0.10.10

dev_dependencies:
  # Policy tests (test/policy) parse source with package:analyzer directly.
  analyzer: any # reason: version follows drift_dev/freezed; policy tests use only stable AST APIs
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true   # AppLocalizations from lib/core/l10n/arb (see l10n.yaml)
  assets:
    - assets/design/palette.json
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# ADR-0006: link SQLCipher instead of plain SQLite on every native target (encryption at rest, 06 §4).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
