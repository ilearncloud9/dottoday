<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Which settings to keep, Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 16px 32px; display: flex; flex-direction: column; gap: 16px; background: {{t.ground}}; color: {{t.ink}}; font-family: Manrope, sans-serif;">
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 8px;">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700;">Which settings should Dottoday use?</h1>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: {{t.secondary}};">Your account already has settings. This device had different ones before you signed in. Your tasks won’t be deleted.</p>
  </div>
  <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px;">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Settings to use</legend>
    <label style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: {{t.surface}}; border: 2px solid {{t.accent}};">
      <span style="display: flex; align-items: center; gap: 12px; min-height: 48px; margin: -12px 0;">
        <input type="radio" name="settings-android" value="account" checked="checked" style="width: 20px; height: 20px; margin: 0; accent-color: {{t.accent}};">
        <span style="font-size: 16px; font-weight: 700;">Your account’s settings</span>
      </span>
      <span style="display: grid; grid-template-columns: minmax(104px, max-content) minmax(0, 1fr); row-gap: 8px; column-gap: 8px; font-size: 14px; line-height: 20px; padding-left: 32px;">
        <span style="color: {{t.secondary}};">Time zone</span><span>Berlin</span>
        <span style="color: {{t.secondary}};">Language</span><span>Deutsch</span>
        <span style="color: {{t.secondary}};">Your day</span><span>7:00 AM – 11:00 PM</span>
        <span style="color: {{t.secondary}};">Layout</span><span>Full</span>
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: {{t.surface}}; border: 2px solid {{t.hair}};">
      <span style="display: flex; align-items: center; gap: 12px; min-height: 48px; margin: -12px 0;">
        <input type="radio" name="settings-android" value="device" style="width: 20px; height: 20px; margin: 0; accent-color: {{t.accent}};">
        <span style="font-size: 16px; font-weight: 700;">This device’s settings</span>
      </span>
      <span style="display: grid; grid-template-columns: minmax(104px, max-content) minmax(0, 1fr); row-gap: 8px; column-gap: 8px; font-size: 14px; line-height: 20px; padding-left: 32px;">
        <span style="color: {{t.secondary}};">Time zone</span><span>Tokyo</span>
        <span style="color: {{t.secondary}};">Language</span><span>English</span>
        <span style="color: {{t.secondary}};">Your day</span><span>6:30 AM – 10:30 PM</span>
        <span style="color: {{t.secondary}};">Layout</span><span>Minimal</span>
      </span>
    </label>
  </fieldset>
  <div style="font-size: 13px; line-height: 18px; color: {{t.secondary}}; padding: 0 8px;">Only the settings that differ are shown.</div>
  <div style="flex: 1 1 auto;"></div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="height: 48px; border-radius: 24px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font-family: Roboto, sans-serif; font-size: 14px; font-weight: 500;">Continue</button>
    <button type="button" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.link}}; font-family: Roboto, sans-serif; font-size: 14px; font-weight: 500;">Decide later</button>
    <div style="font-size: 13px; line-height: 18px; color: {{t.secondary}}; text-align: center;">Until you choose, your account’s settings stay. You can choose in Settings › Account.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { ground: '#171416', surface: '#1F1B1E', ink: '#F3ECE4', secondary: '#C7BEC4', hair: '#3E373D', accent: '#5BC4B8', onAccent: '#0C2523', link: '#5BC4B8' }
      : { ground: '#FBF7F1', surface: '#FFFDF9', ink: '#241F2B', secondary: '#6A6273', hair: '#DDD7E0', accent: '#11615C', onAccent: '#FFFFFF', link: '#11615C' };
    return { t };
  }
}
</script>
</body>
</html>
