<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dottoday — Next up on Apple Watch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA0FF}a:hover{color:#A7BDFF}
</style>
</helmet>
<div style="width: 198px; height: 242px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #F2F2F0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; padding: 26px 14px 12px 14px; display: flex; flex-direction: column; gap: 6px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 12px; font-weight: 600; color: #9A9AA0;">Now</span>
    <div style="width: 18px; height: 18px; border-radius: 50%; background: conic-gradient({{accent}} 0 46%, #2C2C32 46% 100%); display: flex; align-items: center; justify-content: center;" role="img" aria-label="Day 46 percent through">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #000000; display: flex; align-items: center; justify-content: center;"><div style="width: 5px; height: 5px; border-radius: 50%; background: {{accent}};"></div></div>
    </div>
  </div>

  <!-- Current task -->
  <div style="display: flex; gap: 10px; align-items: flex-start;">
    <div style="width: 30px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: conic-gradient({{accent}} 0 68%, rgba(127,160,255,0.25) 68% 100%); display: flex; align-items: center; justify-content: center;">
        <div style="width: 22px; height: 22px; border-radius: 50%; background: #000000; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#7FA0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"></path></svg></div>
      </div>
      <div style="width: 5px; height: 52px; border-radius: 3px; background: linear-gradient(180deg, {{accent}} 0 68%, rgba(127,160,255,0.3) 68% 100%); margin-top: 4px;"></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 2px;">
      <span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">38 min left</span>
      <span style="font-size: 15px; font-weight: 600; line-height: 19px;">Deep work: roadmap</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #7FA0FF; margin-top: 2px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: conic-gradient(#7FA0FF 0 33%, rgba(127,160,255,0.25) 33% 100%);"></span>1 of 3</span>
    </div>
  </div>

  <!-- Next -->
  <div style="display: flex; gap: 10px; align-items: flex-start; opacity: 0.75;">
    <div style="width: 30px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
      <div style="width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; border: 2px solid #9A9AA0; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
      <span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">11:00 · 30 min</span>
      <span style="font-size: 14px; font-weight: 500; line-height: 18px;">Reply to email</span>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <div style="display: flex; gap: 8px;">
    <button type="button" aria-label="Mark Deep work done" style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: {{accent}}; color: #0B1020; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button>
    <button type="button" aria-label="Add 15 minutes" style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: #2C2C32; color: #F2F2F0; font: 600 12px Inter, system-ui, sans-serif; padding: 0;">+15</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7FA0FF","options":["#7FA0FF","#4CC9C9","#FF8A73","#A58BFF"]},"$preview":{"width":198,"height":242}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7FA0FF' };
  }
}
</script>
</body>
</html>
