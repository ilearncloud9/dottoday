<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign out, everything synced, Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.ground}}; color: {{t.ink}}; font-family: Manrope, sans-serif;">
  <div style="height: 64px; margin-top: 32px; display: flex; align-items: center; gap: 8px; padding: 0 4px;">
    <button type="button" aria-label="Back" style="width: 48px; height: 48px; border: none; background: transparent; color: {{t.ink}}; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div style="font-family: Roboto, sans-serif; font-size: 22px; font-weight: 400;">Account</div>
  </div>
  <div style="padding: 8px 16px; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-family: Roboto, sans-serif; font-size: 14px; font-weight: 500; color: {{t.accentText}}; padding: 8px 0;">Sync</div>
    <div style="font-size: 16px; line-height: 24px;">Signed in as sam@example.com</div>
    <div style="font-size: 14px; line-height: 20px; color: {{t.secondary}};">Synced</div>
  </div>
  <div style="position: absolute; inset: 0; background: {{t.scrim}};"></div>
  <div role="alertdialog" aria-labelledby="aa1-title" aria-describedby="aa1-body" style="position: absolute; left: 24px; right: 24px; top: 280px; background: {{t.sheet}}; border-radius: 28px; padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 16px;">
    <h2 id="aa1-title" style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700;">Sign out?</h2>
    <p id="aa1-body" style="margin: 0; font-size: 14px; line-height: 20px; color: {{t.ink2}};">Your tasks and settings are hidden on this device until you sign in again. Everything has synced to your account.</p>
    <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px;">
      <button type="button" style="height: 48px; min-width: 48px; padding: 0 12px; border-radius: 24px; border: none; background: transparent; color: {{t.accentText}}; font-family: Roboto, sans-serif; font-size: 14px; font-weight: 500;">Cancel</button>
      <button type="button" style="height: 48px; min-width: 48px; padding: 0 12px; border-radius: 24px; border: none; background: transparent; color: {{t.accentText}}; font-family: Roboto, sans-serif; font-size: 14px; font-weight: 500;">Sign out</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { ground: '#171416', sheet: '#2F2A30', ink: '#F3ECE4', ink2: '#E2DAD6', secondary: '#C7BEC4', accentText: '#5BC4B8', scrim: 'rgba(0,0,0,.55)' }
      : { ground: '#FBF7F1', sheet: '#FFFDF9', ink: '#241F2B', ink2: '#4E4757', secondary: '#6A6273', accentText: '#11615C', scrim: 'rgba(36,31,43,.36)' };
    return { t };
  }
}
</script>
</body>
</html>
