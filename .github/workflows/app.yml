# App gates (docs/09 M0.8, docs/04 §10). Actions pinned to commit SHAs.
name: app

on:
  push:
    paths: ["app/**", "tool/a11y/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "tool/a11y/**", ".github/workflows/app.yml"]

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

defaults:
  run:
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Codegen is fresh (generated files are committed)
        run: |
          dart run build_runner build -d
          flutter gen-l10n
          git diff --exit-code -- . || { echo "::error::Generated files are stale. Run build_runner and gen-l10n, then commit."; exit 1; }
      - run: dart format --set-exit-if-changed lib test tool
      # dart analyze (not flutter analyze) so the riverpod_lint analyzer plugin runs (M0.11).
      - run: dart analyze --fatal-infos
      # `supabase` tests need a local stack: the supabase workflow runs them.
      - run: flutter test --exclude-tags golden,perf,supabase --test-randomize-ordering-seed random
      # Latency budgets alone, one file at a time: run beside the suite they
      # timed other tests' work and failed at random (M3d.4, 18.9 vs 16 ms).
      - run: flutter test --tags perf --concurrency=1
      # Browser-only widget tests (paste in Chrome); the runner ships Chrome.
      - run: flutter test --platform chrome --tags web test/web
      # web/push_crypto.js against RFC 8291 Appendix A (docs/09 M5.3b).
      - run: node --test tool/push_crypto_test.mjs tool/action_queue_test.mjs

  goldens:
    # Goldens are baselined on macOS; Linux font rendering differs (M0.4).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Verify only: never --update-goldens in CI. Tolerance: test/flutter_test_config.dart.
      - run: flutter test --tags golden
      # Design review (docs/10 §7, M3a.9): every component golden beside its
      # reference render. A review aid, never a gate.
      - run: flutter test --tags reference-sheet
        env:
          REFERENCE_SHEET: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-sheet
          path: app/build/reference_sheet/
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: app/test/**/failures/
          retention-days: 7

  build:
    # Every target must compile, so a broken platform build can't go unnoticed (M0.12).
    # Defines come from .env.example: builds only need the keys to exist, not real values.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, os: ubuntu-24.04, cmd: "flutter build web" }
          - { target: android, os: ubuntu-24.04, cmd: "flutter build apk --debug" }
          # Apple targets need the Xcode 26 SDK (connectivity_plus uses NWPath.isUltraConstrained).
          - { target: macos, os: macos-26, cmd: "flutter build macos --debug" }
          - { target: ios, os: macos-26, cmd: "flutter build ios --simulator --debug" }
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Android build exhausts the default ubuntu disk; drop unused preinstalled toolchains.
      - if: matrix.target == 'android'
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      # Pin Xcode so an image default change can't silently move the SDK (matches local 26.5).
      - if: runner.os == 'macOS'
        working-directory: .
        run: sudo xcode-select -s /Applications/Xcode_26.5.app && xcodebuild -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Local Mac builds sign with the owner's Personal Team so the Keychain
      # trusts each rebuild (ADR-0006 key store); CI has no certificate, so
      # it builds ad-hoc ("Sign to Run Locally") as before.
      - if: matrix.target == 'macos'
        run: >-
          sed -i '' -e '/DEVELOPMENT_TEAM = /d'
          -e 's/"Apple Development"/"-"/'
          macos/Runner.xcodeproj/project.pbxproj
      - if: matrix.target == 'web'
        run: ../tool/web_db_assets.sh
      - run: ${{ matrix.cmd }} --dart-define-from-file=.env.example
      # The menu-bar day dot's goldens and rules (docs/09 M9.6).
      - if: matrix.target == 'macos'
        name: Swift unit tests (macOS RunnerTests)
        run: >-
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner
          -destination 'platform=macOS' -only-testing:RunnerTests -quiet
      # The Swift half of the B6 intents (docs/09 M9.2): queue entries and the
      # optimistic snapshot patch, in RunnerTests on a simulator.
      - if: matrix.target == 'ios'
        name: Swift unit tests (RunnerTests)
        run: >-
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:RunnerTests CODE_SIGNING_ALLOWED=NO -quiet

  integration-android:
    # The device tests on an Android emulator (docs/08 §6, docs/09 M4.9): cold launch,
    # onboarding (timed, resumes after a kill) and the first-day journey (quick add, drag
    # with Shift later tasks, a repeat edited for all days), then a dot-start delivered
    # once with the app killed (M6.5.10). Debug builds (demo day).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A common phone, not the bare default (a 320 × 640 dp screen).
          profile: pixel_6
          disable-animations: true
          working-directory: app
          # Then a dot-start must fire with the app killed (M6.5.10, 11 A0).
          script: >-
            flutter test integration_test/app_launch_test.dart integration_test/onboarding_test.dart
            integration_test/journey_test.dart -d emulator-5554 --dart-define-from-file=.env.example
            && DEFINES=.env.example tool/killed_app_check.sh android emulator-5554

  a11y-web:
    # axe-core over the web build's semantics DOM (docs/08 §3, R-12), plus the encrypted web
    # database probe (M2.9). ~3 min, so every push.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ../tool/web_db_assets.sh
      - run: flutter build web --dart-define-from-file=.env.example
      # The deployed CSP and headers (06 §8, M5.7): everything below runs under it.
      - run: tool/web_csp.sh https://your-project.supabase.co
      - name: Install audit tooling (lockfile-pinned)
        working-directory: tool/a11y
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: axe-core scan (compact + expanded)
        run: |
          (cd build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          node ../tool/a11y/axe_audit.mjs http://127.0.0.1:8080/
      # Keyboard: first Tab = Skip to content, Enter skips the rail, Ctrl+/
      # opens the shortcut list (docs/08 §6.2, M8.7).
      - name: Keyboard checks
        run: node ../tool/a11y/keyboard_check.mjs http://127.0.0.1:8080/
      # No CSP violations, the service worker controls the page, and the app
      # opens offline after one visit (docs/07 Web, M5.7).
      - name: PWA, CSP and offline
        run: node ../tool/a11y/pwa_check.mjs http://127.0.0.1:8080/
      # Encrypted web DB in a real browser: probe writes a task, then storage is scanned
      # for its plaintext title (docs/09 M2.9, ADR-0003).
      - run: flutter build web -t tool/web_db_probe.dart -o "$PWD/build/web_db_probe" --dart-define-from-file=.env.example
      - run: tool/web_csp.sh https://your-project.supabase.co build/web_db_probe
      - name: Web database is encrypted at rest
        run: |
          (cd build/web_db_probe && python3 -m http.server 8081 >/dev/null 2>&1 &)
          sleep 2
          node ../tool/a11y/web_db_probe.mjs http://127.0.0.1:8081/
