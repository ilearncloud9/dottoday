<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; overflow: hidden; background: #121214; color: #F2F2F0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; padding-bottom: 92px;">

    <div style="display: flex; gap: 8px;">
