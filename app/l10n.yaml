# gen-l10n config (docs/09 M0.6). en is the template; de/fr/es (M8.3) must carry
# every key — test/policy/l10n_parity_test.dart fails CI otherwise.
arb-dir: lib/core/l10n/arb
template-arb-file: app_en.arb
output-dir: lib/core/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# A missing key is a compile error, not a runtime null.
nullable-getter: false
