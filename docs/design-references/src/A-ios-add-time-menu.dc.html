<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dottoday — Add · the ⋯ menu on Time (iPhone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B6CF6}a:hover{color:#2B55CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #1A1A1C; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1;">

  <!-- Today underneath (abbreviated) -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;" aria-hidden="true">
    <div style="padding: 58px 20px 0 20px; display: flex; align-items: flex-start; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em;">Today</div>
        <div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #6B6B70;">Wednesday, 21 October</div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: conic-gradient({{accent}} 0 46%, #E2E2DE 46% 100%); display: flex; align-items: center; justify-content: center;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #FAFAF8; display: flex; align-items: center; justify-content: center;"><div style="width: 10px; height: 10px; border-radius: 50%; background: {{accent}};"></div></div>
      </div>
    </div>
    <div style="margin: 18px 12px 0 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #6B6B70;">Sun</span><span style="font-size: 15px; font-weight: 600; color: #6B6B70;">18</span><div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}};"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #6B6B70;">Mon</span><span style="font-size: 15px; font-weight: 600; color: #6B6B70;">19</span><div style="width: 8px; height: 8px; border-radius: 50%; background: conic-gradient({{accent}} 0 70%, #E2E2DE 70% 100%);"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #6B6B70;">Tue</span><span style="font-size: 15px; font-weight: 600; color: #6B6B70;">20</span><div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}};"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px #E2E2DE;"><span style="font-size: 11px; font-weight: 600; color: {{accent}};">Wed</span><span style="font-size: 15px; font-weight: 700;">21</span><div style="width: 8px; height: 8px; border-radius: 50%; background: conic-gradient({{accent}} 0 46%, #E2E2DE 46% 100%);"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #6B6B70;">Thu</span><span style="font-size: 15px; font-weight: 600;">22</span><div style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #C9C9C4;"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #6B6B70;">Fri</span><span style="font-size: 15px; font-weight: 600;">23</span><div style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #C9C9C4;"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #6B6B70;">Sat</span><span style="font-size: 15px; font-weight: 600;">24</span><div style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #C9C9C4;"></div></div>
    </div>
    <div style="margin: 24px 0 0 0; display: flex; height: 62px;">
      <div style="width: 72px; position: relative; display: flex; justify-content: center;">
        <div style="width: 6px; height: 100%; border-radius: 3px; background: #E5674F; opacity: 0.45;"></div>
        <div style="position: absolute; top: 0; width: 36px; height: 36px; border-radius: 50%; background: #E5674F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 7px;"><span style="font-size: 12px; font-weight: 500; color: #6B6B70;">7:30 – 8:00</span><span style="font-size: 16px; font-weight: 500; color: #6B6B70; text-decoration: line-through;">Morning run</span></div>
    </div>
  </div>

  <!-- Dim -->
  <div style="position: absolute; inset: 0; background: rgba(26,26,28,0.42);" aria-hidden="true"></div>

  <!-- Add sheet, step 2 -->
  <div role="dialog" aria-label="Add, step 2 of 3, time" style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; border-radius: 28px 28px 0 0; background: #FFFFFF; box-shadow: 0 -12px 40px rgba(26,26,28,0.18); display: flex; flex-direction: column; padding: 10px 20px 28px 20px; box-sizing: border-box; overflow: hidden;">
    <div style="width: 36px; height: 5px; border-radius: 3px; background: #E2E2DE; margin: 0 auto;" aria-hidden="true"></div>

    <!-- Back · step dots · close -->
    <div style="margin-top: 14px; height: 44px; display: flex; align-items: center; justify-content: space-between;">
      <button type="button" aria-label="Back" style="height: 44px; margin-left: -8px; padding: 0 8px; border: 0; background: transparent; color: {{accent}}; display: inline-flex; align-items: center; gap: 2px; font: 500 16px Inter, system-ui, sans-serif;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back</button>
      <div style="display: flex; align-items: center; gap: 6px;" role="img" aria-label="Step 2 of 3">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #C9C9C4;"></span>
        <span style="width: 18px; height: 6px; border-radius: 3px; background: {{accent}};"></span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #C9C9C4;"></span>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; border-radius: 50%; border: 0; background: transparent; color: #6B6B70; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <!-- Compact identity row: the new dot -->
    <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; border: 2px solid #E5674F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" role="img" aria-label="Coral, shopping bag">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5674F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 13H5z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 18px; line-height: 22px; font-weight: 700; letter-spacing: -0.01em;">Go shopping</span>
        <span style="font-size: 13px; line-height: 16px; font-weight: 500; color: #6B6B70;">Today · 5:00 – 6:00 PM · 1 h</span>
      </div>
    </div>

    <!-- TIME header with the ⋯ button pressed -->
    <div style="margin-top: 20px; height: 28px; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 600; color: #6B6B70; text-transform: uppercase; letter-spacing: 0.04em;">Time</span>
      <button type="button" aria-label="More time options" aria-expanded="true" aria-haspopup="menu" style="width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(59,108,246,0.14); color: {{accent}}; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
    </div>

    <!-- Thread picker placeholder, drawn faintly -->
    <div style="margin-top: 10px; height: 236px; border-radius: 16px; background: #FAFAF8; box-shadow: 0 0 0 1px #E2E2DE; position: relative; overflow: hidden; opacity: 0.7;" role="group" aria-label="Pick a slot on the thread, 4 PM to 7 PM">
      <div style="position: absolute; left: 36px; top: 14px; bottom: 14px; width: 0; border-left: 2px dotted #C9C9C4;" aria-hidden="true"></div>
      <div style="position: absolute; left: 50px; top: 10px; font-size: 11px; font-weight: 500; color: #9A9AA0;">4 PM</div>
      <div style="position: absolute; left: 50px; top: 78px; font-size: 11px; font-weight: 500; color: #9A9AA0;">5 PM</div>
      <div style="position: absolute; left: 50px; top: 146px; font-size: 11px; font-weight: 500; color: #9A9AA0;">6 PM</div>
      <div style="position: absolute; left: 50px; top: 212px; font-size: 11px; font-weight: 500; color: #9A9AA0;">7 PM</div>
      <div style="position: absolute; left: 30px; top: 84px; width: 6px; height: 68px; border-radius: 3px; background: rgba(229,103,79,0.35);" aria-hidden="true"></div>
      <div style="position: absolute; left: 95px; top: 104px; height: 30px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px #E2E2DE; color: #6B6B70; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center;">5:00 – 6:00 PM</div>
    </div>

    <!-- Duration -->
    <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 600; color: #6B6B70; text-transform: uppercase; letter-spacing: 0.04em;">Duration</span>
      <div style="display: flex; gap: 8px;" role="radiogroup" aria-label="Duration">
        <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 13px Inter, system-ui, sans-serif;">15</button>
        <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 13px Inter, system-ui, sans-serif;">30</button>
        <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 13px Inter, system-ui, sans-serif;">45</button>
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 13px Inter, system-ui, sans-serif;">1h</button>
        <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 13px Inter, system-ui, sans-serif;">1.5h</button>
        <button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 13px Inter, system-ui, sans-serif;">2h</button>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; gap: 10px;">
      <button type="button" style="flex: 1.4; height: 50px; border-radius: 25px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 16px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
      <button type="button" style="flex: 1; height: 50px; border-radius: 25px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif;">Add another</button>
    </div>

    <!-- Light dim over the sheet while the menu is open -->
    <div style="position: absolute; inset: 0; border-radius: 28px 28px 0 0; background: rgba(26,26,28,0.06);" aria-hidden="true"></div>

    <!-- Popover menu anchored under the ⋯ button -->
    <div role="menu" aria-label="Time options" style="position: absolute; top: 190px; right: 20px; width: 240px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #E2E2DE, 0 12px 32px rgba(26,26,28,0.16); padding: 6px; display: flex; flex-direction: column;">
      <div style="position: absolute; top: -7px; right: 14px; width: 14px; height: 14px; background: #FFFFFF; border-left: 1px solid #E2E2DE; border-top: 1px solid #E2E2DE; transform: rotate(45deg); border-top-left-radius: 3px;" aria-hidden="true"></div>

      <button type="button" role="menuitem" style="height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #1A1A1C; display: flex; align-items: center; gap: 12px; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); color: {{accent}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
        <span style="flex: 1;">Change day</span>
        <span style="font-size: 13px; font-weight: 500; color: #6B6B70;">Today</span>
      </button>
      <button type="button" role="menuitem" style="height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #1A1A1C; display: flex; align-items: center; gap: 12px; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); color: {{accent}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="3" cy="12" r="1.5"></circle><circle cx="6" cy="12" r="1.5"></circle><circle cx="9" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle><circle cx="21" cy="12" r="1.5"></circle></svg></span>
        <span style="flex: 1;">Pick from the week</span>
      </button>

      <div style="height: 1px; margin: 6px 8px; background: #E2E2DE;" role="separator"></div>

      <button type="button" role="menuitem" style="height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #1A1A1C; display: flex; align-items: center; gap: 12px; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); color: {{accent}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 17a7 7 0 0 1 14 0"></path><path d="M2 21h20M12 4v2M4.2 8.2l1.4 1.4M19.8 8.2l-1.4 1.4"></path></svg></span>
        <span style="flex: 1;">Make it all-day</span>
      </button>
      <button type="button" role="menuitem" style="height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #1A1A1C; display: flex; align-items: center; gap: 12px; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); color: {{accent}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-8h14l2 8"></path><path d="M3 13v6h18v-6h-5a4 4 0 0 1-8 0z"></path></svg></span>
        <span style="flex: 1;">Send to Inbox</span>
      </button>

      <div style="height: 1px; margin: 6px 8px; background: #E2E2DE;" role="separator"></div>

      <button type="button" role="menuitem" style="height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #1A1A1C; display: flex; align-items: center; gap: 12px; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); color: {{accent}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></span>
        <span style="flex: 1;">Time zone</span>
        <span style="font-size: 13px; font-weight: 500; color: #6B6B70;">Berlin</span>
      </button>
      <button type="button" role="menuitem" style="height: 48px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; color: #1A1A1C; display: flex; align-items: center; gap: 12px; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); color: {{accent}}; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"></path></svg></span>
        <span style="flex: 1;">Type a time</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9C9C4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B6CF6","options":["#3B6CF6","#1F9E9E","#E5674F","#7A5AF8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#3B6CF6' };
  }
}
</script>
</body>
</html>
