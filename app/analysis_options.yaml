include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # custom_lint (riverpod_lint 2.x) still uses the legacy analyzer-plugin API, deprecated in
    # current Dart. Silenced until the riverpod_lint 3 / native-plugin migration task (docs/09 M0.11).
    analysis_options_deprecated_plugins: ignore
    missing_required_param: error
    missing_return: error
    todo: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - no_leading_underscores_for_local_identifiers
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_build_context_synchronously
    - use_key_in_widget_constructors
