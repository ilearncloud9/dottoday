<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dottoday — Settings (iPhone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B6CF6}a:hover{color:#2B55CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #1A1A1C; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; padding-bottom: 92px;">

  <!-- Header -->
  <div style="padding: 58px 20px 0 20px; display: flex; align-items: flex-start; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em;">Settings</div>
      <div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #6B6B70;">Kody · synced just now</div>
    </div>
    <!-- Account dot -->
    <button type="button" aria-label="Account, Kody" style="width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: rgba(59,108,246,0.12); color: {{accent}}; font: 700 16px Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center;">K</button>
  </div>

  <!-- Scrolling groups; last visible group fades under the floating bar -->
  <div style="flex: 1; min-height: 0; overflow: hidden; margin-top: 4px; mask-image: linear-gradient(180deg, #000 calc(100% - 56px), transparent 100%); -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 56px), transparent 100%);">

    <!-- DAY SHAPE -->
    <div style="margin: 14px 20px 6px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B70;">Day shape</div>
    <div style="margin: 0 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE; overflow: hidden;">
      <!-- Mini thread: the waking window from sun to moon -->
      <div style="display: flex; align-items: center; gap: 10px; padding: 16px 14px 8px 14px;" role="img" aria-label="Awake from 7:00 to 22:00">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D99A1F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <div style="flex: 1; position: relative; height: 6px; border-radius: 3px; background: #E2E2DE;">
          <div style="position: absolute; left: 29.2%; right: 8.3%; top: 0; bottom: 0; border-radius: 3px; background: {{accent}};"></div>
          <div style="position: absolute; left: 29.2%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 0 3px #FFFFFF;"></div>
          <div style="position: absolute; left: 91.7%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; box-sizing: border-box; border: 2.5px solid {{accent}}; background: #FFFFFF; box-shadow: 0 0 0 3px #FFFFFF;"></div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A5AF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0 40px 12px 40px; font-size: 11px; font-weight: 500; color: #9A9AA0;" aria-hidden="true">
        <span>00</span><span style="color: {{accent}}; font-weight: 600;">15 h awake</span><span>24</span>
      </div>

      <button type="button" aria-label="Wake Up, 7:00" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(217,154,31,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D99A1F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 18h18M5 14a7 7 0 0 1 14 0"/><path d="M12 4v3M5 8l2 2M19 8l-2 2"/></svg></span>
        <span style="flex: 1;">Wake Up</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">7:00</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" aria-label="Bedtime, 22:00" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(122,90,248,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7A5AF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span>
        <span style="flex: 1;">Bedtime</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">22:00</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" aria-label="Week starts, Monday" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(46,143,214,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2E8FD6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <span style="flex: 1;">Week starts</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">Monday</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button type="button" aria-label="Time format, 24 hour" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(107,107,112,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <span style="flex: 1;">Time format</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">24 h</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- PLANNING -->
    <div style="margin: 22px 20px 6px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B70;">Planning</div>
    <div style="margin: 0 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE; overflow: hidden;">
      <button type="button" aria-label="Default duration, 30 minutes" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3B6CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M10 2h4"/></svg></span>
        <span style="flex: 1;">Default duration</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">30 min</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 500; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(107,107,112,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v2M12 9v2M12 15v2M12 21v0"/></svg></span>
        <span style="flex: 1;" id="s-free">Show free time</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="s-free" style="width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 0; background: {{accent}}; position: relative; flex-shrink: 0;"><span style="position: absolute; top: 2px; left: 20px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,28,0.25);"></span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 500; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(229,103,79,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E5674F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span>
        <span style="flex: 1;" id="s-late">Running-late nudge</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="s-late" style="width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 0; background: {{accent}}; position: relative; flex-shrink: 0;"><span style="position: absolute; top: 2px; left: 20px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,28,0.25);"></span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 500; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(31,158,158,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1F9E9E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12a4 4 0 0 1 0 8H8"/><path d="M11 12l-3 4 3 4"/></svg></span>
        <span style="flex: 1; line-height: 18px;" id="s-roll">Roll unfinished tasks to tomorrow</span>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="s-roll" style="width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 0; background: #E2E2DE; position: relative; flex-shrink: 0;"><span style="position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,28,0.25);"></span></button>
      </div>
    </div>

    <!-- REMINDERS -->
    <div style="margin: 22px 20px 6px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B70;">Reminders</div>
    <div style="margin: 0 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE; overflow: hidden;">
      <button type="button" aria-label="Task starts, 5 minutes before" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3B6CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></span>
        <span style="flex: 1;">Task starts</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">5 min before</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 500; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(122,90,248,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7A5AF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span>
        <span style="flex: 1;" id="s-wind">Bedtime reminder</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="s-wind" style="width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 0; background: {{accent}}; position: relative; flex-shrink: 0;"><span style="position: absolute; top: 2px; left: 20px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(26,26,28,0.25);"></span></button>
      </div>
      <button type="button" aria-label="Daily summary, 21:30" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(217,154,31,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D99A1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
        <span style="flex: 1;">Daily summary</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">21:30</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- LOOK -->
    <div style="margin: 22px 20px 6px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B70;">Look</div>
    <div style="margin: 0 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE; overflow: hidden;">
      <button type="button" aria-label="Theme, System" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(107,107,112,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B70" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#6B6B70"/></svg></span>
        <span style="flex: 1;">Theme</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">System</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; font-size: 15px; font-weight: 500; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(59,108,246,0.12); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{accent}}" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg></span>
        <span style="flex: 1;">Accent dot</span>
        <div role="radiogroup" aria-label="Accent dot" style="display: flex; align-items: center; gap: 12px; padding-right: 4px;">
          <button type="button" role="radio" aria-checked="true" aria-label="Blue" style="width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: #3B6CF6; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #3B6CF6;"></button>
          <button type="button" role="radio" aria-checked="false" aria-label="Teal" style="width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: #1F9E9E;"></button>
          <button type="button" role="radio" aria-checked="false" aria-label="Coral" style="width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: #E5674F;"></button>
          <button type="button" role="radio" aria-checked="false" aria-label="Violet" style="width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0; background: #7A5AF8;"></button>
        </div>
      </div>
      <button type="button" aria-label="App icon, Dot" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left; box-shadow: inset 0 1px 0 #E2E2DE;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(46,143,214,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2E8FD6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="2.5" fill="#2E8FD6"/></svg></span>
        <span style="flex: 1;">App icon</span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">Dot</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- DATA -->
    <div style="margin: 22px 20px 6px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B70;">Data</div>
    <div style="margin: 0 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE; overflow: hidden;">
      <button type="button" aria-label="Sync, on" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0 14px; box-sizing: border-box; border: 0; background: transparent; color: #1A1A1C; font: 500 15px Inter, system-ui, sans-serif; text-align: left;">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: rgba(47,163,122,0.14); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2FA37A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg></span>
        <span style="flex: 1;">Sync</span>
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #2FA37A; margin-right: -4px;"></span>
        <span style="font-size: 14px; font-weight: 500; color: #6B6B70;">On</span>
