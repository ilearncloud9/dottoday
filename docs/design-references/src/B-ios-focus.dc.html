<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dottoday — Focus the dot (iPhone, light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B6CF6}a:hover{color:#2B55CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #1A1A1C; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column; padding-bottom: 160px;">

  <!-- Header -->
  <div style="padding: 58px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; height: 94px; box-sizing: border-box;">
    <button type="button" aria-label="Back to Today" style="display: inline-flex; align-items: center; gap: 2px; padding: 0; border: 0; background: transparent; font: 500 15px Inter, system-ui, sans-serif; color: #3B6CF6; width: 72px; justify-content: flex-start;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Today
    </button>
    <span style="font-size: 12px; font-weight: 600; color: #6B6B70; text-transform: uppercase; letter-spacing: 0.08em;">Focus</span>
    <div style="width: 72px; display: flex; justify-content: flex-end;">
      <button type="button" aria-label="More" style="width: 28px; height: 28px; border-radius: 50%; border: 0; background: #F1F1EE; color: #1A1A1C; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
    </div>
  </div>

  <!-- Centre stage: the live dot at 160 px -->
  <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 0;">
    <div style="width: 160px; height: 160px; border-radius: 50%; background: conic-gradient({{accent}} 0 68%, #E2E2DE 68% 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 32px rgba(59,108,246,0.16);" role="img" aria-label="Deep work: roadmap, 68 percent elapsed">
      <div style="width: 136px; height: 136px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"></path></svg>
      </div>
    </div>
    <span style="margin-top: 18px; font-size: 13px; font-weight: 500; color: #6B6B70;">9:00 – 11:00 · 2 h</span>
    <span style="margin-top: 4px; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em; color: #1A1A1C;">Deep work: roadmap</span>
    <span style="margin-top: 4px; font-size: 16px; font-weight: 500; color: {{accent}};">38 min left</span>
  </div>

  <!-- Current subtask card -->
  <section aria-label="Current step: Draft timeline, step 2 of 3, 14 minutes 20 seconds left" style="margin: 22px 20px 0 20px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px #E2E2DE, 0 4px 14px rgba(26,26,28,0.05); padding: 14px 16px 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 22px; height: 22px; border-radius: 50%; background: conic-gradient({{accent}} 0 45%, #E2E2DE 45% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0;" role="img" aria-label="Step 45 percent elapsed">
        <div style="width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF;"></div>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 11px; font-weight: 600; color: #6B6B70; text-transform: uppercase; letter-spacing: 0.06em;">Step 2 of 3</span>
        <span style="font-size: 15px; font-weight: 600; color: #1A1A1C;">Draft timeline</span>
      </div>
      <span style="font-size: 15px; font-weight: 600; color: {{accent}}; font-feature-settings: 'tnum' 1; flex-shrink: 0;">14:20 left</span>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #E2E2DE; overflow: hidden;" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Step progress">
      <div style="width: 45%; height: 100%; border-radius: 2px; background: {{accent}};"></div>
    </div>
  </section>

  <!-- Step list as a mini vertical thread -->
  <div style="margin: 10px 20px 0 36px; display: flex; flex-direction: column;" role="list" aria-label="Steps">
    <div role="listitem" style="display: flex; align-items: center; height: 28px;">
      <div style="width: 32px; position: relative; height: 100%; display: flex; justify-content: center; align-items: center;">
        <div style="position: absolute; top: 14px; bottom: -14px; width: 0; border-left: 2px dotted #C9C9C4;"></div>
        <div style="position: relative; width: 16px; height: 16px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
      </div>
      <span style="margin-left: 8px; font-size: 14px; font-weight: 500; color: #6B6B70; text-decoration: line-through;">Outline Q1 goals</span>
    </div>
    <div role="listitem" aria-current="step" style="display: flex; align-items: center; height: 28px;">
      <div style="width: 32px; position: relative; height: 100%; display: flex; justify-content: center; align-items: center;">
        <div style="position: absolute; top: -14px; bottom: -14px; width: 6px; border-radius: 3px; background: linear-gradient(180deg, {{accent}} 0 45%, rgba(59,108,246,0.28) 45% 100%);"></div>
        <div style="position: relative; width: 16px; height: 16px; border-radius: 50%; background: conic-gradient({{accent}} 0 45%, rgba(59,108,246,0.25) 45% 100%); display: flex; align-items: center; justify-content: center;"><div style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF;"></div></div>
      </div>
      <span style="margin-left: 8px; font-size: 14px; font-weight: 600; color: {{accent}};">Draft timeline</span>
    </div>
    <div role="listitem" style="display: flex; align-items: center; height: 28px;">
      <div style="width: 32px; position: relative; height: 100%; display: flex; justify-content: center; align-items: center;">
        <div style="position: absolute; top: -14px; bottom: 14px; width: 0; border-left: 2px dotted #C9C9C4;"></div>
        <div style="position: relative; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; border: 2px solid #6B6B70; background: #FAFAF8;"></div>
      </div>
      <span style="margin-left: 8px; font-size: 14px; font-weight: 500; color: #1A1A1C;">Share with Sam</span>
    </div>
  </div>

  <!-- Toggles -->
  <div style="margin: 14px 20px 0 20px; display: flex; gap: 8px;">
    <button type="button" role="switch" aria-checked="false" aria-label="Chime every 15 minutes, off" style="flex: 1; height: 40px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #6B6B70; display: inline-flex; align-items: center; justify-content: space-between; padding: 0 6px 0 12px; font: 500 12px Inter, system-ui, sans-serif;">
      <span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>Chime every 15 min</span>
      <span style="width: 34px; height: 20px; border-radius: 10px; background: #E2E2DE; position: relative; display: inline-block;" aria-hidden="true"><span style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.2);"></span></span>
    </button>
    <button type="button" role="switch" aria-checked="true" aria-label="Deep work, iOS Focus on" style="flex: 1; height: 40px; border-radius: 999px; border: 1px solid rgba(59,108,246,0.35); background: rgba(59,108,246,0.10); color: #3B6CF6; display: inline-flex; align-items: center; justify-content: space-between; padding: 0 6px 0 12px; font: 600 12px Inter, system-ui, sans-serif;">
      <span style="display: inline-flex; align-items: center; gap: 6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"></path></svg>Deep work · Focus on</span>
      <span style="width: 34px; height: 20px; border-radius: 10px; background: {{accent}}; position: relative; display: inline-block;" aria-hidden="true"><span style="position: absolute; top: 2px; left: 16px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.2);"></span></span>
    </button>
  </div>

  <!-- Bottom actions -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 46px; display: flex; flex-direction: column; gap: 10px;">
    <button type="button" aria-label="Mark Deep work done" style="height: 54px; border-radius: 999px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 16px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(59,108,246,0.28);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Done
    </button>
    <div style="display: flex; gap: 10px;">
      <button type="button" aria-label="Add fifteen minutes" style="flex: 1; height: 44px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 14px Inter, system-ui, sans-serif;">+15 min</button>
      <button type="button" aria-label="Next step" style="flex: 1; height: 44px; border-radius: 999px; border: 1px solid #E2E2DE; background: #FFFFFF; color: #1A1A1C; font: 500 14px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">Next step<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
  </div>

  <!-- Caption -->
  <div style="position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 500; color: #9A9AA0;">Dot starts still break through Focus (time-sensitive)</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B6CF6","options":["#3B6CF6","#1F9E9E","#E5674F","#7A5AF8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#3B6CF6' };
  }
}
</script>
</body>
</html>
