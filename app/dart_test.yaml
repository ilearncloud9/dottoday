tags:
  web:
    # Browser-only widget tests (paste in Chrome, M3c follow-up). Run with
    # `flutter test --platform chrome --tags web test/web`.
  golden:
    # Pixel goldens are baselined on macOS; run on a macOS runner (docs/09 M0.8).
  perf:
    # Database latency budgets (docs/09 M2.7, R-15). CI runs them in their own
    # step with --concurrency=1 so other test files don't skew the timings.
  reference-sheet:
    # Writes build/reference_sheet/ for design review (docs/10 §7, M3a.9).
    # Skipped unless REFERENCE_SHEET is set; never a pass/fail gate.
  store-screenshots:
    # Writes ../docs/store/screenshots/ (docs/09 M8.6). Skipped unless
    # STORE_SCREENSHOTS is set; never a pass/fail gate.
  supabase:
    # Against a local Supabase stack (docs/09 M6.1): locally the isolated
    # test stack (`tool/test_stack.sh test`, port 55321); the supabase
    # workflow runs them on 54321 with CI=true; the unit job excludes them.
    # SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY /
    # MAILPIT_URL come from the environment only.
