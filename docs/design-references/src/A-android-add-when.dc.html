<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dottoday — Add · When (Android)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA0FF}a:hover{color:#A7BDFF}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; overflow: hidden; background: #121214; color: #F2F2F0; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1;">

  <!-- Today underneath (abbreviated) -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;" aria-hidden="true">
    <div style="padding: 44px 8px 0 16px; height: 108px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em;">Today</div><div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #9A9AA0;">Wednesday, 21 October</div></div>
      <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; margin-right: 48px;"><div style="width: 36px; height: 36px; border-radius: 50%; background: conic-gradient({{accent}} 0 46%, #2C2C32 46% 100%); display: flex; align-items: center; justify-content: center;"><div style="width: 26px; height: 26px; border-radius: 50%; background: #121214; display: flex; align-items: center; justify-content: center;"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}};"></div></div></div></div>
    </div>
    <div style="margin: 4px 8px 0 8px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">Sun</span><span style="font-size: 15px; font-weight: 600; color: #9A9AA0;">18</span><div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}};"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">Mon</span><span style="font-size: 15px; font-weight: 600; color: #9A9AA0;">19</span><div style="width: 8px; height: 8px; border-radius: 50%; background: conic-gradient({{accent}} 0 70%, #2C2C32 70% 100%);"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">Tue</span><span style="font-size: 15px; font-weight: 600; color: #9A9AA0;">20</span><div style="width: 8px; height: 8px; border-radius: 50%; background: {{accent}};"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; background: #1C1C20; border-radius: 14px; box-shadow: 0 0 0 1px #2C2C32;"><span style="font-size: 11px; font-weight: 600; color: {{accent}};">Wed</span><span style="font-size: 15px; font-weight: 700;">21</span><div style="width: 8px; height: 8px; border-radius: 50%; background: conic-gradient({{accent}} 0 46%, #2C2C32 46% 100%);"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">Thu</span><span style="font-size: 15px; font-weight: 600;">22</span><div style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #3A3A40;"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">Fri</span><span style="font-size: 15px; font-weight: 600;">23</span><div style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #3A3A40;"></div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0;"><span style="font-size: 11px; font-weight: 500; color: #9A9AA0;">Sat</span><span style="font-size: 15px; font-weight: 600;">24</span><div style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #3A3A40;"></div></div>
    </div>
    <div style="margin: 28px 0 0 0; display: flex; height: 62px;">
      <div style="width: 72px; position: relative; display: flex; justify-content: center;"><div style="width: 6px; height: 100%; border-radius: 3px; background: #E5674F; opacity: 0.45;"></div><div style="position: absolute; top: 0; width: 36px; height: 36px; border-radius: 50%; background: #E5674F; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div></div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 7px;"><span style="font-size: 12px; font-weight: 500; color: #9A9AA0;">7:30 – 8:00</span><span style="font-size: 16px; font-weight: 500; color: #9A9AA0; text-decoration: line-through;">Morning run</span></div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);" aria-hidden="true"></div>

  <!-- Modal bottom sheet · step 2: When -->
  <div role="dialog" aria-label="Add, step 2 of 3: when" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; border-radius: 28px 28px 0 0; background: #1C1C20; display: flex; flex-direction: column; padding: 8px 16px 24px 16px; box-sizing: border-box;">
    <div style="width: 32px; height: 4px; border-radius: 2px; background: #9A9AA0; opacity: 0.6; margin: 0 auto;" aria-hidden="true"></div>

    <!-- Back · step dots · Close -->
    <div style="margin-top: 12px; height: 48px; display: flex; align-items: center; justify-content: space-between;">
      <button type="button" aria-label="Back to step 1" style="height: 48px; margin-left: -12px; padding: 0 12px; border: 0; background: transparent; color: #7FA0FF; font: 600 15px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; gap: 4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
      <div style="display: flex; align-items: center; gap: 6px;" role="img" aria-label="Step 2 of 3">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #3A3A40;"></span>
        <span style="width: 18px; height: 6px; border-radius: 3px; background: {{accent}};"></span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #3A3A40;"></span>
      </div>
      <button type="button" aria-label="Close" style="width: 48px; height: 48px; margin-right: -12px; border-radius: 50%; border: 0; background: transparent; color: #9A9AA0; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <!-- Identity: the dot being placed -->
    <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; border: 2px solid #E5674F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" role="img" aria-label="Coral shopping bag dot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5674F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em;">Go shopping</span>
        <span style="font-size: 13px; font-weight: 500; color: #9A9AA0;">Today · 5:00 – 6:00 PM · 1 h</span>
      </div>
    </div>

    <!-- TIME -->
    <div style="margin-top: 18px; height: 28px; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 600; color: #9A9AA0; text-transform: uppercase; letter-spacing: 0.04em;">Time</span>
      <button type="button" aria-label="More time options" aria-haspopup="menu" style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid #2C2C32; background: transparent; color: #9A9AA0; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
    </div>

    <!-- THE THREAD PICKER: scroll today's thread under a fixed window -->
    <div role="group" aria-label="Time picker. Scroll the thread to move the task. Selected 5:00 to 6:00 PM" style="margin-top: 8px; position: relative; height: 236px; border-radius: 12px; background: #121214; box-shadow: 0 0 0 1px #2C2C32; overflow: hidden;">
      <!-- scrolling slice, faded like a wheel above and below the window, thread fading out at the bottom -->
      <div style="position: absolute; inset: 0; mask-image: linear-gradient(180deg, rgba(0,0,0,0.45) 0, rgba(0,0,0,0.45) 96px, #000 96px, #000 140px, rgba(0,0,0,0.45) 140px, rgba(0,0,0,0.45) 196px, transparent 100%); -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.45) 0, rgba(0,0,0,0.45) 96px, #000 96px, #000 140px, rgba(0,0,0,0.45) 140px, rgba(0,0,0,0.45) 196px, transparent 100%);" aria-hidden="true">
        <!-- thread column, 1 h = 36 px -->
        <div style="position: absolute; left: 0; top: 0; width: 56px; height: 236px;">
          <div style="position: absolute; left: 27px; top: 0; width: 0; height: 100%; border-left: 2px dotted #3A3A40;"></div>
          <!-- Spanish lesson 2:00 – 3:00 (tail of it at the top) -->
          <div style="position: absolute; left: 25px; top: -8px; width: 6px; height: 36px; border-radius: 3px; background: rgba(31,158,158,0.35);"></div>
          <div style="position: absolute; left: 17px; top: 2px; width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: 2px solid #1F9E9E; background: #121214; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1F9E9E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h12v15"/><path d="M4 19a2 2 0 0 0 2 2h12"/></svg></div>
          <!-- Call the dentist 4:00 – 4:15 -->
          <div style="position: absolute; left: 25px; top: 64px; width: 6px; height: 9px; border-radius: 3px; background: rgba(217,154,31,0.35);"></div>
          <div style="position: absolute; left: 17px; top: 64px; width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: 2px solid #D99A1F; background: #121214; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#D99A1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
          <!-- Go shopping 5:00 – 6:00 (the new segment, inside the window) -->
          <div style="position: absolute; left: 25px; top: 100px; width: 6px; height: 36px; border-radius: 3px; background: #E5674F;"></div>
          <div style="position: absolute; left: 17px; top: 100px; width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: 2px solid #E5674F; background: #121214; box-shadow: 0 0 0 4px rgba(229,103,79,0.28); display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#E5674F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></div>
        </div>
        <!-- hour labels, aligned to the thread -->
        <span style="position: absolute; left: 64px; top: 56px; font-size: 12px; line-height: 16px; font-weight: 500; color: #9A9AA0;">4 PM</span>
        <span style="position: absolute; left: 64px; top: 92px; font-size: 12px; line-height: 16px; font-weight: 500; color: #9A9AA0;">5 PM</span>
        <span style="position: absolute; left: 64px; top: 128px; font-size: 12px; line-height: 16px; font-weight: 500; color: #9A9AA0;">6 PM</span>
        <span style="position: absolute; left: 64px; top: 164px; font-size: 12px; line-height: 16px; font-weight: 500; color: #9A9AA0;">7 PM</span>
        <!-- end of the thread -->
        <span style="position: absolute; left: 64px; top: 206px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 500; color: #9A9AA0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Wind Down · 22:00</span>
      </div>
      <!-- fixed selection window -->
      <div style="position: absolute; left: 0; right: 0; top: 96px; height: 44px; box-sizing: border-box; border-top: 1px solid {{accent}}; border-bottom: 1px solid {{accent}}; background: rgba(127,160,255,0.08); pointer-events: none;" aria-hidden="true">
        <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 30px; padding: 0 14px; border-radius: 999px; background: {{accent}}; color: #0B1020; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; display: inline-flex; align-items: center; white-space: nowrap;">5:00 – 6:00 PM</div>
      </div>
    </div>
    <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: #9A9AA0;" role="status">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2.5 3.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/></svg>
      Free until 7:30 PM · no overlap
    </div>

    <!-- DURATION -->
    <div style="margin-top: 16px; height: 28px; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 600; color: #9A9AA0; text-transform: uppercase; letter-spacing: 0.04em;">Duration</span>
      <button type="button" aria-label="More duration options" aria-haspopup="menu" style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid #2C2C32; background: transparent; color: #9A9AA0; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
    </div>
    <!-- M3 filter chips -->
    <div style="margin-top: 8px; display: flex; gap: 8px;" role="radiogroup" aria-label="Duration">
      <button type="button" role="radio" aria-checked="false" aria-label="15 minutes" style="flex: 1; height: 32px; padding: 0; border-radius: 8px; border: 1px solid #2C2C32; background: transparent; color: #F2F2F0; font: 500 13px Inter, system-ui, sans-serif;">15</button>
      <button type="button" role="radio" aria-checked="false" aria-label="30 minutes" style="flex: 1; height: 32px; padding: 0; border-radius: 8px; border: 1px solid #2C2C32; background: transparent; color: #F2F2F0; font: 500 13px Inter, system-ui, sans-serif;">30</button>
      <button type="button" role="radio" aria-checked="false" aria-label="45 minutes" style="flex: 1; height: 32px; padding: 0; border-radius: 8px; border: 1px solid #2C2C32; background: transparent; color: #F2F2F0; font: 500 13px Inter, system-ui, sans-serif;">45</button>
      <button type="button" role="radio" aria-checked="true" aria-label="1 hour, selected" style="flex: 1.3; height: 32px; padding: 0; border-radius: 8px; border: 0; background: rgba(127,160,255,0.22); color: #F2F2F0; font: 600 13px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7FA0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>1h</button>
      <button type="button" role="radio" aria-checked="false" aria-label="1.5 hours" style="flex: 1; height: 32px; padding: 0; border-radius: 8px; border: 1px solid #2C2C32; background: transparent; color: #F2F2F0; font: 500 13px Inter, system-ui, sans-serif;">1.5h</button>
      <button type="button" role="radio" aria-checked="false" aria-label="2 hours" style="flex: 1; height: 32px; padding: 0; border-radius: 8px; border: 1px solid #2C2C32; background: transparent; color: #F2F2F0; font: 500 13px Inter, system-ui, sans-serif;">2h</button>
    </div>

    <!-- Where it lands -->
    <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #121214; box-shadow: 0 0 0 1px #2C2C32;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;" aria-hidden="true"><div style="width: 0; height: 8px; border-left: 2px dotted #3A3A40;"></div><div style="width: 6px; height: 14px; border-radius: 3px; background: #E5674F;"></div><div style="width: 0; height: 8px; border-left: 2px dotted #3A3A40;"></div></div>
      <span style="flex: 1; font-size: 12px; font-weight: 500; color: #9A9AA0;">Lands on <span style="color: #F2F2F0; font-weight: 600;">Today</span> at 5:00 – 6:00 PM · the slot is free</span>
      <a href="#edit" aria-label="Edit when it lands" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 8px 4px;">Edit</a>
    </div>

    <div style="flex: 1;"></div>

    <!-- M3 buttons: filled + outlined -->
    <div style="display: flex; gap: 10px;">
      <button type="button" style="flex: 1.4; height: 48px; border-radius: 24px; border: 0; background: {{accent}}; color: #0B1020; font: 600 15px Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      <button type="button" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #3A3A40; background: transparent; color: #7FA0FF; font: 600 15px Inter, system-ui, sans-serif;">Add another</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7FA0FF","options":["#7FA0FF","#4CC9C9","#FF8A73","#A58BFF"]},"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7FA0FF' };
  }
}
</script>
</body>
</html>
