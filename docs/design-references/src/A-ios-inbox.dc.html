<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #1A1A1C; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column;">

      <span style="display: inline-flex; align-items: center; gap: 4px;">Trash<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>

    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE;">

    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE;">
      <div style="width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box; border: 2px solid #D99A1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D99A1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>

      <button type="button" aria-label="Schedule Do taxes" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(59,108,246,0.12); color: #3B6CF6; display: flex; align-items: center; justify-content: center; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,28,0.06), 0 0 0 1px #E2E2DE;">

    <!-- Suggestion: next free slot on today's thread -->
    <div style="margin-top: 6px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; border: 1px dashed #C9C9C4;">
      <div style="width: 0; height: 22px; border-left: 2px dotted #C9C9C4;"></div>
      <span style="flex: 1; font-size: 12px; font-weight: 500; color: #6B6B70;">Next free slot today: 11:30 – 12:30 · fits Go for a run</span>
      <button type="button" style="height: 28px; padding: 0 12px; border-radius: 999px; border: 0; background: {{accent}}; color: #FFFFFF; font: 600 12px Inter, system-ui, sans-serif;">Place</button>
    </div>

    <!-- Completed group, collapsed -->
    <button type="button" aria-expanded="false" style="margin-top: 4px; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 4px; border: 0; background: transparent; color: #6B6B70; font: 600 13px Inter, system-ui, sans-serif; width: 100%;">
      <span style="display: inline-flex; align-items: center; gap: 8px;">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: #C9C9C4; display: inline-flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
        Completed · 12

      <a href="Main.dc.html" aria-label="Today" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px; height: 48px; justify-content: center; color: #6B6B70; text-decoration: none;">

      <a href="#inbox" aria-label="Inbox" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 52px; height: 48px; justify-content: center; border-radius: 24px; background: rgba(59,108,246,0.12); color: #3B6CF6; text-decoration: none;">
